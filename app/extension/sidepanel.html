<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Claim Check — Consistency Side Panel</title>
  <style>
    /* ===== Base / Neobrutalist Design System ===== */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: "Courier New", Courier, monospace, sans-serif;
      background-color: #ffde47;
      color: #000000;
      min-height: 100vh;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 16px 0;
      text-transform: uppercase;
      border: 3px solid #000000;
      background-color: #ffffff;
      padding: 12px;
      box-shadow: 6px 6px 0px 0px #000000;
      text-align: center;
    }

    .card {
      border: 3px solid #000000;
      background-color: #ffffff;
      padding: 12px;
      box-shadow: 4px 4px 0px 0px #000000;
      margin-bottom: 16px;
    }

    .verdict-report {
      background-color: #ffffff;
      padding: 12px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      margin-top: 12px;
    }

    /* ===== Speaker Badge ===== */
    .speaker-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      margin-top: 6px;
      color: #000;
    }
    .speaker-high { background-color: #d4edda; border: 1px solid #c3e6cb; }
    .speaker-medium { background-color: #fff3cd; border: 1px solid #ffeeba; }
    .speaker-low { background-color: #f8d7da; border: 1px solid #f5c6cb; }

    .card-title {
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 8px;
      border-bottom: 2px solid #000000;
      padding-bottom: 4px;
      font-size: 13px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 4px;
      text-transform: uppercase;
      font-size: 11px;
    }

    input[type="text"] {
      width: calc(100% - 18px);
      padding: 6px;
      border: 3px solid #000000;
      font-family: inherit;
      font-weight: bold;
      margin-bottom: 12px;
    }

    input[type="text"]:focus {
      outline: none;
      background-color: #e6ffff;
    }

    /* ===== Buttons ===== */
    .btn {
      width: 100%;
      padding: 12px;
      font-family: inherit;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      border: 3px solid #000000;
      background-color: #ff5252;
      color: #ffffff;
      box-shadow: 4px 4px 0px 0px #000000;
      transition: all 0.1s ease;
      font-size: 14px;
      margin-bottom: 10px;
      display: block;
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px 0px #000000;
    }

    .btn.active {
      background-color: #2ed573;
      color: #ffffff;
    }

    /* 12.1.a — Secondary / Clear button */
    .btn-secondary {
      background-color: #ffffff;
      color: #000000;
      font-size: 12px;
      padding: 8px 12px;
      margin-bottom: 16px;
    }

    .btn-secondary:hover {
      background-color: #f0f0f0;
    }

    /* ===== Status bar ===== */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: bold;
    }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      border: 2px solid #000000;
      text-transform: uppercase;
      font-size: 10px;
      font-weight: bold;
    }

    .badge.connected {
      background-color: #2ed573;
      color: #ffffff;
    }

    .badge.disconnected {
      background-color: #ff5252;
      color: #ffffff;
    }

    /* ===== 12.2.e — Global Stats Bar ===== */
    .stats-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      border: 3px solid #000000;
      background-color: #000000;
      color: #ffde47;
      padding: 6px 10px;
      box-shadow: 3px 3px 0px 0px #555555;
      margin-bottom: 12px;
    }

    .stats-bar .stat-item {
      white-space: nowrap;
    }

    .stats-bar .stat-sep {
      opacity: 0.4;
    }

    .stats-bar.hidden {
      display: none;
    }

    /* ===== Live Feed ===== */
    .feed-container {
      margin-top: 4px;
    }

    .feed-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .feed-title {
      font-size: 16px;
      font-weight: bold;
      text-transform: uppercase;
      border: 3px solid #000000;
      background-color: #ffffff;
      padding: 5px 8px;
      box-shadow: 3px 3px 0px 0px #000000;
    }

    /* ===== Log Item Shell ===== */
    .log-item {
      border: 3px solid #000000;
      background-color: #ffffff;
      padding: 12px;
      margin-bottom: 14px;
      box-shadow: 4px 4px 0px 0px #000000;
      position: relative;
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .log-timestamp {
      font-size: 9px;
      color: #555555;
      font-weight: bold;
      font-family: "Courier New", monospace;
      white-space: nowrap;
      margin-left: 8px;
      flex-shrink: 0;
    }

    .log-sentence {
      font-size: 12px;
      line-height: 1.5;
      font-weight: bold;
      margin-bottom: 8px;
    }

    /* ===== 12.2.a — Verdict Card Components ===== */

    /* Verdict badge (top-right pill) */
    .verdict-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border: 2px solid #000000;
      font-size: 9px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      flex-shrink: 0;
    }

    .verdict-badge.consistent {
      background-color: #2ed573;
      color: #ffffff;
    }

    .verdict-badge.contradiction {
      background-color: #ff5252;
      color: #ffffff;
    }

    .verdict-badge.neutral {
      background-color: #f1f2f6;
      color: #333333;
    }

    .verdict-badge.unverified {
      background-color: #ffa502;
      color: #ffffff;
    }

    /* 12.2.c — Analyzing pulsing badge */
    .verdict-badge.analyzing {
      background-color: #747d8c;
      color: #ffffff;
      animation: pulse-opacity 1.2s ease-in-out infinite;
    }

    @keyframes pulse-opacity {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.45; }
    }

    /* Topic tag */
    .topic-tag {
      display: inline-block;
      padding: 1px 6px;
      border: 2px solid #000000;
      font-size: 9px;
      font-weight: bold;
      text-transform: uppercase;
      background-color: #ffde47;
      color: #000000;
      margin-bottom: 8px;
    }

    /* Verdict report block */
    .verdict-report {
      margin-top: 8px;
      border-top: 2px dashed #000000;
      padding-top: 8px;
    }

    /* Inline claim text + per-claim badge row */
    .claim-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-top: 4px;
      margin-bottom: 2px;
    }

    .claim-text {
      font-size: 11px;
      font-weight: bold;
      flex: 1;
      line-height: 1.4;
    }

    /* Smaller badge variant used per-claim inside a report block */
    .claim-verdict-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 6px;
      border: 2px solid #000000;
      font-size: 8px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .claim-verdict-badge.consistent   { background-color: #2ed573; color: #ffffff; }
    .claim-verdict-badge.contradiction { background-color: #ff5252; color: #ffffff; }
    .claim-verdict-badge.neutral       { background-color: #f1f2f6; color: #333333; }
    .claim-verdict-badge.unverified    { background-color: #ffa502; color: #ffffff; }

    /* Collapsible historical comparison (12.2.a) */
    .historical-block {
      margin-top: 6px;
    }

    .historical-block summary {
      cursor: pointer;
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      user-select: none;
      color: #333333;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .historical-block summary::-webkit-details-marker { display: none; }

    .historical-block summary::before {
      content: "▶";
      font-size: 8px;
      transition: transform 0.15s ease;
    }

    .historical-block[open] summary::before {
      transform: rotate(90deg);
    }

    .historical-quote {
      margin: 6px 0 0 0;
      padding: 6px 10px;
      border-left: 4px solid #000000;
      background-color: #f8f8f8;
      font-size: 11px;
      font-style: italic;
      line-height: 1.4;
    }

    /* Numeric diff badge (12.2.a) */
    .diff-badge {
      display: inline-block;
      padding: 2px 6px;
      border: 2px solid #000000;
      font-size: 10px;
      font-weight: bold;
      font-family: "Courier New", monospace;
      margin-top: 6px;
    }

    .diff-badge.positive {
      background-color: #ff5252;
      color: #ffffff;
    }

    .diff-badge.negative {
      background-color: #2ed573;
      color: #ffffff;
    }

    .diff-badge.neutral-diff {
      background-color: #f1f2f6;
      color: #333333;
    }

    /* Explanation text */
    .log-explanation {
      margin-top: 6px;
      font-size: 11px;
      font-style: italic;
      color: #333333;
      line-height: 1.4;
      border-top: 1px dotted #999999;
      padding-top: 4px;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 24px;
      border: 3px dashed #000000;
      background-color: #ffffff;
      color: #555555;
      font-style: italic;
      font-size: 12px;
      box-shadow: 4px 4px 0px 0px #000000;
    }

    /* ===== 12.1.d — Snackbar ===== */
    .snackbar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background-color: #000000;
      color: #ffffff;
      font-family: "Courier New", monospace;
      font-size: 11px;
      font-weight: bold;
      padding: 10px 16px;
      border: 2px solid #ffffff;
      box-shadow: 4px 4px 0px 0px #555555;
      display: flex;
      align-items: center;
      gap: 14px;
      white-space: nowrap;
      z-index: 9999;
      transition: transform 0.2s ease;
      pointer-events: none;
    }

    .snackbar.visible {
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    .snackbar-undo {
      background: none;
      border: none;
      color: #ffde47;
      font-family: "Courier New", monospace;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
    }

    /* ===== 11.2.e — Transcript Mode Badge ===== */
    .transcript-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border: 3px solid #000000;
      background-color: #ffffff;
      box-shadow: 4px 4px 0px 0px #000000;
      font-family: "Courier New", monospace;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 12px;
      letter-spacing: 0.03em;
    }

    .transcript-badge::before {
      content: "📄";
      font-size: 14px;
    }

    .transcript-badge.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h1>Claim Check</h1>

  <div class="card">
    <div class="card-title">Setup</div>
    <label for="ws-url">WebSocket URL</label>
    <input type="text" id="ws-url" value="ws://localhost:8000/ws/live-speech">

    <div class="status-bar">
      <span>Service State:</span>
      <span id="status-badge" class="badge disconnected">Disconnected</span>
    </div>
  </div>

  <button id="toggle-btn" class="btn">Connect &amp; Listen</button>

  <!-- 12.1.a — Clear Feed button, secondary neobrutalist style -->
  <button id="clear-btn" class="btn btn-secondary">🗑 Clear Feed</button>

  <!-- 11.2.e — Transcript Mode Badge (hidden by default, shown when transcript is active) -->
  <div id="transcript-mode-badge" class="transcript-badge hidden" role="status">
    Using Pre-built Transcript
  </div>

  <div class="feed-container">
    <div class="feed-header">
      <div class="feed-title">Live Analysis Feed</div>
    </div>

    <!-- 12.2.e — Global Stats Bar -->
    <div id="stats-bar" class="stats-bar hidden">
      <span class="stat-item" id="stat-sentences">0 sentences</span>
      <span class="stat-sep">|</span>
      <span class="stat-item" id="stat-contradictions">0 contradictions</span>
      <span class="stat-sep">|</span>
      <span class="stat-item" id="stat-consistent">0 consistent</span>
      <span class="stat-sep">|</span>
      <span class="stat-item" id="stat-unverified">0 unverified</span>
    </div>

    <div id="feed-list">
      <div class="empty-state">No statements parsed yet. Connect the WebSocket and start playing a broadcast.</div>
    </div>
  </div>

  <!-- 12.1.d — Snackbar (hidden by default) -->
  <div id="snackbar" class="snackbar" role="status" aria-live="polite">
    <span>Feed cleared.</span>
    <button id="snackbar-undo" class="snackbar-undo">Undo</button>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
